name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest --cov=src --cov-report=term-missing

      - name: Example-config placeholders are rejected
        run: |
          if python -m src.pipeline --config config.example.yaml --check; then
            echo "config.example.yaml with placeholders must not pass the check"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t grokbot-pumpfun:ci .
      - name: Image starts and rejects a config with placeholders
        run: |
          if docker run --rm grokbot-pumpfun:ci --config /app/config.example.yaml --check; then
            echo "image accepted a config without keys — that must not happen"
            exit 1
          fi
