# Example config. Copy to config.yaml and put in your keys.
#   cp config.example.yaml config.yaml
# config.yaml is in .gitignore and does not reach the repository.
#
# You do not have to put secrets in the file at all — environment
# variables take precedence:
#   GROKBOT_GROK_API_KEY, GROKBOT_DATA_API_KEY, GROKBOT_WALLET_PRIVATE_KEY,
#   GROKBOT_MODE, GROKBOT_RPC_URL, GROKBOT_LOG_PATH, GROKBOT_LOG_LEVEL,
#   GROKBOT_STATE_PATH, GROKBOT_HEALTH_PORT
# That is how the Dockerfile works: the image contains no keys.
#
# The config is validated at startup. Nonsense values (a zero limit,
# a threshold out of range, live without a wallet key) refuse to start
# instead of surprising you an hour into trading.

mode: dry-run            # dry-run | live

grok:
  api_key: "xai-YOUR-KEY-HERE"
  base_url: "https://api.x.ai/v1/chat/completions"
  fast_model: "grok-4-fast"   # auditor, narrative, timing
  checker_model: "grok-4"     # adversarial checker, the stronger model
  timeout_seconds: 30
  max_retries: 3
  retry_base_delay: 1.0       # exponential backoff: base * 2**attempt

solana:
  rpc_url: "https://api.mainnet-beta.solana.com"
  wallet_private_key: "YOUR-BASE58-PRIVATE-KEY"
  jito:
    enabled: true
    block_engine_url: "https://mainnet.block-engine.jito.wtf/api/v1/bundles"
    tip_lamports: 1000000     # tip for priority

data:
  api_key: "YOUR-DATA-PROVIDER-KEY"
  rest_url: "https://frontend-api.pump.fun"
  ws_url: "wss://pumpportal.fun/api/data"
  request_timeout: 10

risk:
  max_sol_per_trade: 0.5        # SOL ceiling per trade
  daily_loss_limit_sol: 2.0     # daily loss limit; hitting it stops trading
  max_trades_per_day: 20        # max trades per day
  max_open_positions: 3         # max concurrent open positions
  max_total_exposure_sol: 1.5   # max SOL in the market at once
  cooldown_after_losses: 3      # this many losses in a row trigger a pause; 0 disables
  cooldown_minutes: 30          # pause length
  stop_loss_pct: 30.0           # stop-loss in percent, watched in the background
  stop_loss_poll_seconds: 15
  # Exits upward and by time. 0 in any of them turns that rule off.
  take_profit_pct: 120.0        # take profit at +120%
  trailing_stop_pct: 35.0       # pullback from the peak; computed only above entry
  max_hold_seconds: 3600        # a memecoin that did not move in an hour will not move

filter:
  min_unique_buyers: 5          # minimum unique buyers
  max_curve_progress: 0.40      # curve fill under 40%
  require_metadata: true        # has a name and an image
  min_age_seconds: 120          # older than 2 minutes
  max_risk_score: 7.0           # analyzer cutoff, 0..10
  min_total_score: 0.65         # minimum score to go to the checker
  # Memory of token creators, counted from our own closed trades.
  block_creator_after_rugs: 1   # this many rugs and the address is cut; 0 disables
  rug_loss_pct: 60.0            # a loss from this level counts as a rug
  one_position_per_creator: true  # two tokens from one deployer are one bet
  forget_creators_after_days: 30  # clean addresses are forgotten, rugged ones are not

scoring:
  weights:
    audit: 0.30                 # auditor agent: organic share and absence of flags
    narrative: 0.25             # narrative agent: meme potential
    timing: 0.15                # timing agent: market state
    metrics: 0.30               # analyzer metrics computed in code
  timing_cache_seconds: 900     # timing-agent cache, 15 minutes

logging:
  path: "logs/trades.jsonl"
  level: "INFO"
  max_bytes: 50000000         # rotate JSONL past this size, 0 — do not rotate
  backups: 5                  # how many .1 .2 .3 to keep

alerts:
  # Empty — notifications off. Message format is understood by Slack (text)
  # and Discord (content); Telegram needs an intermediate relay.
  # The URL usually contains a token, so set it via
  # GROKBOT_ALERT_WEBHOOK rather than storing it in the file.
  webhook_url: ""
  events: ["started", "buy", "close", "rug", "breaker", "halted", "blind"]
  timeout_seconds: 10
  max_per_minute: 20          # extras are dropped, not queued

ops:
  state_path: "state/pipeline.json"   # positions and daily counters, survive a restart
  reputation_path: "state/creators.json"  # memory of token creators
  health_port: 0                      # 0 — off; otherwise GET /healthz and /metrics
  health_host: "127.0.0.1"
  heartbeat_seconds: 300              # liveness line in the log
  shutdown_grace_seconds: 30          # how long to wait for in-flight tokens on stop
  max_grok_calls_per_day: 2000        # daily ceiling on agent spend
  grok_max_concurrency: 4             # concurrent Grok requests
  grok_calls_per_minute: 60           # rate limiter
  breaker_failures: 8                 # this many failures in a row open the circuit
  breaker_cooldown_seconds: 120       # and for this long the pipeline stops calling Grok
